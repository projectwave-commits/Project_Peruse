<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="robots" content="noindex">
  <title>Hellenic Academy</title>
  <link rel="icon" href="logo.png" type="image/png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="topbar">
    <span class="title">Hellenic Academy</span>
    <button id="theme" class="icon-btn" type="button"></button>
  </header>
  <main>
    <img class="crest" src="logo.png" alt="Hellenic Academy">

    <p id="status" class="status" role="status">Loading…</p>

    <section id="signin" hidden>
      <h1>Sign in</h1>
      <form id="signin-form" class="card stack">
        <p id="signin-error" class="error" role="alert" hidden></p>
        <label>Username
          <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </section>

    <section id="apps" hidden>
      <h1>Staff apps</h1>
      <p class="who">Signed in as <strong id="who"></strong> · <button id="signout" class="link" type="button">Sign out</button></p>
      <nav class="apps" aria-label="Apps">
        <a class="app" href="../demerits/">
          <strong>Demerits</strong>
          <span>Prefect demerits, Dress Parade and Manual Labour lists</span>
        </a>
        <a class="app" href="../sign_ups/staff">
          <strong>Sign-ups</strong>
          <span>Sports and club options for each term</span>
        </a>
      </nav>
    </section>
  </main>
  <script src="home.js"></script>
</body>
</html>
