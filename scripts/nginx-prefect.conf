# Serves the app at /demerits/, on the school network only. scripts/setup-nginx.ps1 adds this to nginx.
# ^~ stops any regex location in that block, or the other project's catch-all, from taking these paths.
location = /demerits {
    return 301 /demerits/;
}

# The app's old address, so existing bookmarks and home screen icons still work.
location = /prefect {
    return 301 /demerits/;
}
location ^~ /prefect/ {
    return 301 /demerits/;
}

location ^~ /demerits/ {
    # A tunnel such as ngrok reaches nginx from this machine, so this machine's own addresses are refused.
    # 127.0.0.1 is refused by "deny all". Phones reach the app from other 10.x.x.x addresses.
    deny 10.2.0.190;
    allow 10.0.0.0/8;
    deny all;

    # The trailing slash removes /demerits from the path the app sees.
    proxy_pass http://127.0.0.1:3080/;
    proxy_set_header Host $host;
    # Replaces anything the phone sent, so the login limiter sees the real address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Matches the app's own limit, for student list imports.
    client_max_body_size 10m;
}
