# Serves the app at /prefect/. Paste inside the existing server { } block on the school server.
# ^~ stops any regex location in that block, or the other project's catch-all, from taking these paths.
location = /prefect {
    return 301 /prefect/;
}

location ^~ /prefect/ {
    # The trailing slash removes /prefect from the path the app sees.
    proxy_pass http://127.0.0.1:3080/;
    proxy_set_header Host $host;
    # Replaces anything the phone sent, so the login limiter sees the real address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Matches the app's own limit, for student list imports.
    client_max_body_size 10m;
}
