# Serves the staff home page at /home/, on the school network only. scripts/setup-nginx.ps1 adds this to
# nginx and fills in __REPO__. The page is plain files, so no app needs to run for it.
location = /home {
    return 301 /home/;
}

location ^~ /home/ {
    # A tunnel such as ngrok reaches nginx from this machine, so this machine's own addresses are refused.
    deny 10.2.0.190;
    allow 10.0.0.0/8;
    deny all;

    alias __REPO__/home/public/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}
