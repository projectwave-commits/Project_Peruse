# Serves the app at /sign_ups/, on the school network only. scripts/setup-nginx.ps1 adds this to nginx.
# ^~ stops any regex location in that block, or the other project's catch-all, from taking these paths.
location = /sign_ups {
    return 301 /sign_ups/;
}

location ^~ /sign_ups/ {
    # A tunnel such as ngrok reaches nginx from this machine, so this machine's own addresses are refused.
    # 127.0.0.1 is refused by "deny all". Devices reach the app from other 10.x.x.x addresses.
    deny 10.2.0.190;
    allow 10.0.0.0/8;
    deny all;

    # The trailing slash removes /sign_ups from the path the app sees.
    proxy_pass http://127.0.0.1:3081/;
    proxy_set_header Host $host;
    # Replaces anything the device sent, so the login limiter and audit log see the real address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}
